[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
addopts = -v --tb=short -ra
norecursedirs = scripts node_modules .git __pycache__ frontend .venv venv
filterwarnings =
    ignore::DeprecationWarning:google.*
    ignore::UserWarning
    ignore:.*PyType_Spec.*:DeprecationWarning
markers =
    unit: marks unit tests
    integration: marks integration tests requiring external services
    slow: marks slow tests
    e2e: marks end-to-end tests requiring running backend
    requires_db: marks tests requiring PostgreSQL database
